<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
  <title>Knowledge Map · Grades 6–12</title>
  <meta name="description" content="A friendly, standards-aligned learning map for grades 6-12 — Westchester County, NY. Math, Science, ELA & Social Studies with interactive science animations, exercises, quizzes and problem sets." />
  <meta name="theme-color" content="#4f6ef7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e1424" media="(prefers-color-scheme: dark)" />

  <!-- PWA / iPad home-screen app -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Knowledge Map" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <a class="site-back" href="../" title="Back to The Curious Family Library">←<span>The&nbsp;Curious&nbsp;Family&nbsp;Library</span></a>
    <div class="brand" onclick="location.hash='#/'">
      <div class="brand-badge">🧭</div>
      <div>
        <div class="brand-title">Knowledge Map</div>
        <div class="brand-sub">Grades 6–12 · Westchester NY</div>
      </div>
    </div>
    <div class="header-spacer"></div>
    <button class="icon-btn" onclick="location.hash='#/map'" title="Knowledge Map" aria-label="Knowledge Map">🗺️</button>
    <button class="icon-btn" id="searchBtn" title="Search (press /)" aria-label="Search">🔎</button>
    <button class="icon-btn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle theme">🌗</button>
  </header>

  <div class="search-overlay" id="searchOverlay" aria-hidden="true">
    <div class="search-modal" role="dialog" aria-label="Search">
      <div class="search"><input id="searchInput" type="search" placeholder="Search topics, ideas, vocabulary…" autocomplete="off" /></div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <main id="view" class="container" role="main">
    <div class="empty"><div class="big">📚</div><p>Loading your learning map…</p></div>
  </main>

  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <!-- Data is compiled from data/**/*.json by build/build.mjs -->
  <script src="app-data.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
  <!-- Privacy-friendly, cookieless visit counter (aggregate page views only) -->
  <script data-goatcounter="https://meiradavidson.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
